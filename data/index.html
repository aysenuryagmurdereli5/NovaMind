<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DENEYAP - Giriş</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ff8c42;
            --primary-light: #ffb366;
            --secondary: #fbbf24;
            --dark-bg: #0f1419;
            --dark-surface: #1e293b;
            --dark-surface-alt: #334155;
            --text-light: #f1f5f9;
            --text-soft: #cbd5e1;
            --border: #475569;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", sans-serif;
            background: linear-gradient(135deg, #ff8c42 0%, #ffb366 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Dekoratif Daireler */
        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            pointer-events: none;
        }

        body::before {
            width: 500px;
            height: 500px;
            background: rgba(255, 255, 255, 0.2);
            top: -100px;
            left: -100px;
        }

        body::after {
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.2);
            bottom: -80px;
            right: -80px;
        }

        .login-wrapper {
            background: var(--dark-surface);
            border-radius: 20px;
            padding: 50px 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
        }

        /* Logo & Title */
        .logo-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-icon {
            font-size: 56px;
            margin-bottom: 15px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .logo-section h1 {
            font-size: 32px;
            color: var(--secondary);
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .logo-section p {
            color: var(--text-soft);
            font-size: 13px;
            font-weight: 500;
        }

        /* Demo Info Box */
        .demo-box {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 30px;
            border-left: 4px solid var(--primary);
        }

        .demo-box p {
            color: var(--dark-bg);
            font-size: 11px;
            margin: 0;
            line-height: 1.6;
        }

        .demo-box code {
            background: var(--dark-surface);
            color: var(--secondary);
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 600;
            font-size: 10px;
        }

        /* Form */
        .login-form h2 {
            font-size: 20px;
            color: var(--text-light);
            margin-bottom: 28px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            color: var(--text-light);
            font-size: 13px;
            font-weight: 600;
        }

        .form-group label .icon {
            font-size: 16px;
        }

        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            background: var(--dark-surface-alt);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            color: var(--text-light);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: rgba(203, 213, 225, 0.5);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 140, 66, 0.1);
            background: rgba(51, 65, 85, 0.8);
        }

        /* Şifre Input Özel */
        .password-group {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 4px 8px;
            color: var(--text-soft);
            transition: color 0.3s;
        }

        .toggle-password:hover {
            color: var(--primary);
        }

        /* Checkbox */
        .form-group.checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .form-group.checkbox input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .form-group.checkbox label {
            margin-bottom: 0;
            font-size: 13px;
            font-weight: 400;
            cursor: pointer;
        }

        /* Şifremi Unuttum */
        .forgot-password {
            display: block;
            text-align: right;
            color: var(--secondary);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 28px;
            transition: color 0.3s;
        }

        .forgot-password:hover {
            color: var(--primary-light);
        }

        /* Login Button */
        .btn-login {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--dark-bg);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(255, 140, 66, 0.3);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(255, 140, 66, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        /* Footer */
        .footer {
            text-align: center;
            color: var(--text-soft);
            font-size: 11px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-wrapper {
                padding: 30px 20px;
                border-radius: 16px;
            }

            .logo-icon {
                font-size: 44px;
            }

            .logo-section h1 {
                font-size: 26px;
            }

            .demo-box {
                padding: 12px 14px;
            }

            .form-group input {
                padding: 10px 14px;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <!-- Logo & Title -->
        <div class="logo-section">
            <div class="logo-icon">🚀</div>
            <h1>DENEYAP</h1>
            <p>Yapay Zeka Destekli Görev Takip Sistemi</p>
        </div>

        <!-- Demo Info -->
        <div class="demo-box">
            <p>📌 Kullanıcı: <code>user</code> | Şifre: <code>pass</code></p>
            <p>🔐 Admin: <code>admin</code> | Şifre: <code>pass</code></p>
        </div>

        <!-- Login Form -->
        <form class="login-form" id="loginForm">
            <h2>Giriş Yap</h2>

            <!-- Kullanıcı Adı -->
            <div class="form-group">
                <label for="username">
                    <span class="icon">👤</span>
                    Kullanıcı Adı
                </label>
                <input 
                    type="text" 
                    id="username" 
                    placeholder="Kullanıcı adınızı girin"
                    required
                >
            </div>

            <!-- Şifre -->
            <div class="form-group password-group">
                <label for="password">
                    <span class="icon">🔒</span>
                    Şifre
                </label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Şifrenizi girin"
                    required
                >
                <button type="button" class="toggle-password" id="togglePassword">👁️</button>
            </div>

            <!-- Remember Me -->
            <div class="form-group checkbox">
                <input type="checkbox" id="rememberMe">
                <label for="rememberMe">Beni Hatırla</label>
            </div>

            <!-- Forgot Password -->
            <a href="#" class="forgot-password">Şifremi Unuttum</a>

            <!-- Login Button -->
            <button type="submit" class="btn-login">Giriş Yap</button>

            <!-- Footer -->
            <div class="footer">
                © 2026 T3 Vakfı - DENEYAP Programı
            </div>
        </form>
    </div>

    <script>
        // Demo Kullanıcılar
        const demoUsers = {
            'user': 'pass',
            'admin': 'pass'
        };

        // Şifre Göz Butonu
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', (e) => {
            e.preventDefault();
            const type = passwordInput.getAttribute('type');
            if (type === 'password') {
                passwordInput.setAttribute('type', 'text');
                togglePassword.textContent = '🚫';
            } else {
                passwordInput.setAttribute('type', 'password');
                togglePassword.textContent = '👁️';
            }
        });

        // Form Gönder
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            
            // Doğrulama
            if (!username || !password) {
                alert('Kullanıcı adı ve şifre gerekli!');
                return;
            }
            
            // Kimlik Doğrulama
            if (demoUsers[username] === password) {
                // Remember Me
                if (rememberMe) {
                    localStorage.setItem('savedUsername', username);
                } else {
                    localStorage.removeItem('savedUsername');
                }
                
                // Giriş Başarılı
                alert(`Hoşgeldiniz, ${username}!`);
                // window.location.href = 'dashboard.html';
            } else {
                alert('❌ Hatalı kullanıcı adı veya şifre!');
                passwordInput.value = '';
                passwordInput.focus();
            }
        });

        // Sayfa Yüklendiğinde Remember Me'yi Kontrol Et
        window.addEventListener('load', () => {
            const savedUsername = localStorage.getItem('savedUsername');
            if (savedUsername) {
                document.getElementById('username').value = savedUsername;
                document.getElementById('rememberMe').checked = true;
                document.getElementById('password').focus();
            }
        });
    </script>
</body>
</html>
