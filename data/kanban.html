<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DENEYAP - Kanban Board</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ff8c42;
            --primary-light: #ffb366;
            --secondary: #fbbf24;
            --dark-bg: #0f1419;
            --dark-surface: #1e293b;
            --dark-surface-alt: #334155;
            --text-light: #f1f5f9;
            --text-soft: #cbd5e1;
            --border: #475569;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", sans-serif;
            background: var(--dark-bg);
            color: var(--text-light);
        }

        /* Header */
        .header {
            background: var(--dark-surface);
            border-bottom: 1px solid var(--border);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-mini {
            font-size: 24px;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--secondary);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-link {
            color: var(--text-soft);
            text-decoration: none;
            font-size: 14px;
            padding: 8px 12px;
            border-radius: 6px;
            transition: all 0.3s;
        }

        .nav-link:hover,
        .nav-link.active {
            background: var(--dark-surface-alt);
            color: var(--primary);
        }

        .btn-logout {
            background: var(--primary);
            color: var(--dark-bg);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background: var(--primary-light);
        }

        /* Main Container */
        .container {
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: var(--dark-surface);
            border-right: 1px solid var(--border);
            padding: 20px;
            min-height: calc(100vh - 60px);
        }

        .sidebar h3 {
            font-size: 12px;
            color: var(--text-soft);
            text-transform: uppercase;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-item {
            color: var(--text-soft);
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-item:hover,
        .sidebar-item.active {
            background: var(--dark-surface-alt);
            color: var(--primary);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-x: auto;
        }

        .kanban-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .kanban-header h1 {
            font-size: 28px;
            color: var(--text-light);
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
        }

        .filter-btn {
            background: var(--dark-surface-alt);
            color: var(--text-soft);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--primary);
            color: var(--dark-bg);
            border-color: var(--primary);
        }

        /* Kanban Board */
        .kanban-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            min-height: 600px;
        }

        .kanban-column {
            background: var(--dark-surface-alt);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
        }

        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border);
        }

        .column-title {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .column-count {
            background: var(--dark-surface);
            color: var(--text-soft);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        /* Status Icons */
        .status-todo { color: var(--warning); }
        .status-progress { color: var(--primary); }
        .status-done { color: var(--success); }

        /* Task Cards */
        .tasks-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        .task-card {
            background: var(--dark-surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            cursor: grab;
            transition: all 0.3s;
        }

        .task-card:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(255, 140, 66, 0.2);
            transform: translateY(-2px);
        }

        .task-card:active {
            cursor: grabbing;
        }

        .task-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-light);
        }

        .task-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .task-deadline {
            font-size: 11px;
            color: var(--text-soft);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .priority-badge {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .priority-high {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .priority-medium {
            background: rgba(245, 158, 11, 0.2);
            color: #fed7aa;
        }

        .priority-low {
            background: rgba(16, 185, 129, 0.2);
            color: #a7f3d0;
        }

        /* Add Task Button */
        .add-task-btn {
            background: var(--dark-surface);
            border: 2px dashed var(--border);
            color: var(--text-soft);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
            margin-top: auto;
        }

        .add-task-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(255, 140, 66, 0.05);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--dark-surface);
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            border: 1px solid var(--border);
        }

        .modal-header {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-light);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-soft);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            background: var(--dark-surface-alt);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-light);
            font-size: 13px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-submit {
            flex: 1;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--dark-bg);
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-cancel {
            flex: 1;
            background: var(--dark-surface-alt);
            color: var(--text-soft);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-cancel:hover {
            background: var(--border);
        }

        /* Responsive */
        @media (max-width: 1200px) {
    .kanban-board {
        grid-template-columns: repeat(2, 1fr);
    }
}
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }

            .main-content {
                padding: 15px;
            }

            .kanban-header {
                flex-direction: column;
                gap: 15px;
            }

            .kanban-header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="logo-mini">🚀</div>
            <div class="header-title">DENEYAP</div>
        </div>
        <div class="header-right">
            <a href="index.html" class="nav-link">Giriş Yap</a>
            <a href="#" class="nav-link active">Kanban Board</a>
            <a href="#" class="nav-link">Raporlar</a>
            <button class="btn-logout" onclick="logout()">Çıkış Yap</button>
        </div>
    </header>

    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h3>👤 Menü</h3>
            <div class="sidebar-menu">
                <a href="#" class="sidebar-item active">📋 Kanban Board</a>
                <a href="#" class="sidebar-item">📊 Dashboard</a>
                <a href="#" class="sidebar-item">⚙️ Ayarlar</a>
                <a href="#" class="sidebar-item">❓ Yardım</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <div class="kanban-header">
                <h1>📌 Görev Takip Tahtası</h1>
                <div class="filter-buttons">
                    <button class="filter-btn active">Tümü</button>
                    <button class="filter-btn">Yüksek Öncelik</button>
                    <button class="filter-btn">Bu Hafta</button>
                </div>
            </div>

            <!-- Kanban Board -->
            <div class="kanban-board">
                <!-- Column 1: Yapılacaklar -->
                <div class="kanban-column">
                    <div class="column-header">
                        <div class="column-title">
                            <span class="status-todo">📋</span>
                            Yapılacaklar
                        </div>
                        <div class="column-count" id="todo-count">0</div>
                    </div>

                    <div class="tasks-container" id="todo-tasks">
                        <!-- Tasks dinamik olarak eklenecek -->
                    </div>

                    <button class="add-task-btn" onclick="openModal('todo')">+ Yeni Görev</button>
                </div>

                <!-- Column 2: Yapılıyor -->
                <div class="kanban-column">
                    <div class="column-header">
                        <div class="column-title">
                            <span class="status-progress">🔄</span>
                            Yapılıyor
                        </div>
                        <div class="column-count" id="progress-count">0</div>
                    </div>

                    <div class="tasks-container" id="progress-tasks">
                        <!-- Tasks dinamik olarak eklenecek -->
                    </div>

                    <button class="add-task-btn" onclick="openModal('progress')">+ Yeni Görev</button>
                </div>
                <!-- Column 3: Kontrol Edildi -->
<div class="kanban-column">
    <div class="column-header">
        <div class="column-title">
            <span style="color: #3b82f6;">🔍</span>
            Kontrol Edildi
        </div>
        <div class="column-count" id="review-count">0</div>
    </div>

    <div class="tasks-container" id="review-tasks">
        <!-- Tasks dinamik olarak eklenecek -->
    </div>

    <button class="add-task-btn" onclick="openModal('review')">+ Yeni Görev</button>
</div>

<!-- Column 4: Tamamlandı (Bunu aşağıya taşı) -->
<div class="kanban-column">
    ...
</div>

                <!-- Column 3: Tamamlandı -->
                <div class="kanban-column">
                    <div class="column-header">
                        <div class="column-title">
                            <span class="status-done">✅</span>
                            Tamamlandı
                        </div>
                        <div class="column-count" id="done-count">0</div>
                    </div>

                    <div class="tasks-container" id="done-tasks">
                        <!-- Tasks dinamik olarak eklenecek -->
                    </div>

                    <button class="add-task-btn" onclick="openModal('done')">+ Yeni Görev</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Task Modal -->
    <div class="modal" id="taskModal">
        <div class="modal-content">
            <div class="modal-header">Yeni Görev Ekle</div>
            
            <div class="form-group">
                <label>Görev Adı</label>
                <input type="text" id="taskName" placeholder="Görev adını gir">
            </div>

            <div class="form-group">
                <label>Deadline</label>
                <input type="date" id="taskDeadline">
            </div>

            <div class="form-group">
                <label>Öncelik</label>
                <select id="taskPriority">
                    <option value="low">Düşük</option>
                    <option value="medium" selected>Orta</option>
                    <option value="high">Yüksek</option>
                </select>
            </div>

            <div class="modal-buttons">
                <button class="btn-submit" onclick="addTask()">Ekle</button>
                <button class="btn-cancel" onclick="closeModal()">İptal</button>
            </div>
        </div>
    </div>

    <script>
        let currentColumn = '';
        let taskId = 0;

        // Mock Tasks
      const mockTasks = [
    { id: 1, title: "Ankara Etkinliği Hazırlığı", deadline: "2026-08-30", priority: "high", status: "todo" },
    { id: 2, title: "İstanbul Semineri Sunum", deadline: "2026-08-28", priority: "high", status: "progress" },
    { id: 3, title: "İzmir Öğretmen Eğitimi", deadline: "2026-09-05", priority: "medium", status: "todo" },
    { id: 4, title: "Gaziantep Demo Oturumu", deadline: "2026-08-25", priority: "low", status: "review" },
    { id: 5, title: "Konya Pilot Programı", deadline: "2026-09-10", priority: "medium", status: "progress" },
    { id: 6, title: "Diyarbakır Bilişim Eğitimi", deadline: "2026-08-22", priority: "low", status: "done" }
];

        let tasks = [...mockTasks];
        taskId = Math.max(...tasks.map(t => t.id)) + 1;
// Render Tasks
    function renderTasks() {
    const todoTasks = tasks.filter(t => t.status === 'todo');
    const progressTasks = tasks.filter(t => t.status === 'progress');
    const reviewTasks = tasks.filter(t => t.status === 'review');
    const doneTasks = tasks.filter(t => t.status === 'done');

    document.getElementById('todo-tasks').innerHTML = todoTasks.map(t => createTaskCard(t)).join('');
    document.getElementById('progress-tasks').innerHTML = progressTasks.map(t => createTaskCard(t)).join('');
    document.getElementById('review-tasks').innerHTML = reviewTasks.map(t => createTaskCard(t)).join('');
    document.getElementById('done-tasks').innerHTML = doneTasks.map(t => createTaskCard(t)).join('');

    document.getElementById('todo-count').textContent = todoTasks.length;
    document.getElementById('progress-count').textContent = progressTasks.length;
    document.getElementById('review-count').textContent = reviewTasks.length;
    document.getElementById('done-count').textContent = doneTasks.length;
}

        // Create Task Card HTML
        function createTaskCard(task) {
            const date = new Date(task.deadline);
            const formattedDate = date.toLocaleDateString('tr-TR', { month: 'short', day: 'numeric' });
            
            return `
                <div class="task-card" draggable="true" ondragstart="dragStart(event)" data-id="${task.id}">
                    <div class="task-title">${task.title}</div>
                    <div class="task-meta">
                        <div class="task-deadline">📅 ${formattedDate}</div>
                        <span class="priority-badge priority-${task.priority}">
                            ${task.priority === 'high' ? '🔴 Yüksek' : task.priority === 'medium' ? '🟡 Orta' : '🟢 Düşük'}
                        </span>
                    </div>
                </div>
            `;
        }

        // Modal Functions
        function openModal(column) {
            currentColumn = column;
            document.getElementById('taskModal').classList.add('active');
            document.getElementById('taskName').focus();
        }

        function closeModal() {
            document.getElementById('taskModal').classList.remove('active');
            document.getElementById('taskName').value = '';
            document.getElementById('taskDeadline').value = '';
            document.getElementById('taskPriority').value = 'medium';
        }

        function addTask() {
            const name = document.getElementById('taskName').value.trim();
            const deadline = document.getElementById('taskDeadline').value;
            const priority = document.getElementById('taskPriority').value;

            if (!name) {
                alert('Görev adı gerekli!');
                return;
            }

            const newTask = {
                id: taskId++,
                title: name,
                deadline: deadline || new Date().toISOString().split('T')[0],
                priority: priority,
                status: currentColumn
            };

            tasks.push(newTask);
            renderTasks();
            closeModal();
        }

        // Drag & Drop (Basit)
        function dragStart(e) {
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('taskId', e.target.closest('.task-card').dataset.id);
        }

        // Logout
        function logout() {
            if (confirm('Çıkmak istediğinizden emin misiniz?')) {
                window.location.href = 'index.html';
            }
        }

        // Modal dışında tıklamayı kapat
        document.getElementById('taskModal').addEventListener('click', (e) => {
            if (e.target.id === 'taskModal') {
                closeModal();
            }
        });

        // Enter tuşu ile ekle
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && document.getElementById('taskModal').classList.contains('active')) {
                addTask();
            }
        });

        // İlk render
        renderTasks();
    </script>
</body>
</html>
